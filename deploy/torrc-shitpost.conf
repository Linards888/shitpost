# Shitpost onion service — appended to /etc/tor/torrc
# Tor forwards .onion visitors (port 80) to the app's separate onion listener (ONION_PORT=3080).
HiddenServiceDir /var/lib/tor/shitpost/
HiddenServicePort 80 127.0.0.1:3080
# Rate-limits connection floods at the Tor level (Tor 0.4.2+).
HiddenServiceEnableIntroDoSDefense 1
# Proof-of-work flood protection: only works on Tor 0.4.8+ built with it. Uncomment if
# `tor --version` is 0.4.8 or newer — on older Tor this line stops Tor from starting.
#HiddenServicePoWDefensesEnabled 1
